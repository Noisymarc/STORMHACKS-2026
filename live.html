<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Translation Demo</title>
</head>
<body>
  <h1>Live Translation Demo</h1>
  <p>Gemini listens directly to your microphone and streams Spanish captions. This demo displays captions only; generated audio is not played.</p>

  <button id="start-button" type="button">Start microphone</button>
  <button id="stop-button" type="button" disabled>Stop</button>
  <p id="status" role="status">Microphone is off.</p>
  <p id="error" role="alert"></p>

  <h2>Transcript</h2>
  <p id="source-caption" aria-live="polite">—</p>

  <h2>Spanish translation</h2>
  <p id="translated-caption" aria-live="polite">—</p>

  <script>
    const startButton = document.querySelector('#start-button');
    const stopButton = document.querySelector('#stop-button');
    const statusText = document.querySelector('#status');
    const errorText = document.querySelector('#error');
    const sourceCaption = document.querySelector('#source-caption');
    const translatedCaption = document.querySelector('#translated-caption');

    let socket = null;
    let stream = null;
    let audioContext = null;
    let microphone = null;
    let audioProcessor = null;
    let stopping = false;
    let sourceText = '';
    let translationText = '';
    let pendingAudio = new Uint8Array(0);
    let ready = false;

    function sendAudio(buffer) {
      const packet = new Uint8Array(buffer);
      const combined = new Uint8Array(pendingAudio.length + packet.length);
      combined.set(pendingAudio);
      combined.set(packet, pendingAudio.length);
      let offset = 0;
      // 100 ms of mono PCM16 at 16 kHz = 3200 bytes.
      while (combined.length - offset >= 3200) {
        socket.send(combined.slice(offset, offset + 3200));
        offset += 3200;
      }
      pendingAudio = combined.slice(offset);
    }

    function convertToPcm16(samples, inputRate, outputRate = 16000) {
      const ratio = inputRate / outputRate;
      const outputLength = Math.floor(samples.length / ratio);
      const buffer = new ArrayBuffer(outputLength * 2);
      const view = new DataView(buffer);

      for (let i = 0; i < outputLength; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), samples.length);
        let sum = 0;
        for (let j = start; j < end; j++) sum += samples[j];
        const sample = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
        view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      }

      return buffer;
    }

    async function stopMicrophone() {
      stopping = true;
      if (audioProcessor) audioProcessor.disconnect();
      if (microphone) microphone.disconnect();
      if (socket && socket.readyState === WebSocket.OPEN) {
        if (pendingAudio.length) socket.send(pendingAudio);
        socket.send('stop');
        statusText.textContent = 'Finishing the last captions…';
        const closingSocket = socket;
        await Promise.race([
          new Promise(resolve => closingSocket.addEventListener('close', resolve, { once: true })),
          new Promise(resolve => setTimeout(resolve, 3000)),
        ]);
        closingSocket.close();
      } else if (socket) socket.close();
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (audioContext && audioContext.state !== 'closed') await audioContext.close();

      socket = null;
      stream = null;
      audioContext = null;
      microphone = null;
      audioProcessor = null;
      startButton.disabled = false;
      stopButton.disabled = true;
      statusText.textContent = 'Microphone is off.';
    }

    async function startMicrophone() {
      errorText.textContent = '';
      startButton.disabled = true;
      stopping = false;
      ready = false;
      sourceText = '';
      translationText = '';
      pendingAudio = new Uint8Array(0);
      sourceCaption.textContent = '—';
      translatedCaption.textContent = '—';

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
        audioContext = new AudioContext();
        await audioContext.resume();

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}/ws/continuous`);
        socket.binaryType = 'arraybuffer';

        await new Promise((resolve, reject) => {
          socket.onmessage = event => {
            const message = JSON.parse(event.data);
            if (message.type === 'status') {
              statusText.textContent = message.message;
              ready = true;
              resolve();
            }
            if (message.type === 'source_delta') {
              sourceText += message.text;
              sourceCaption.textContent = sourceText;
            }
            if (message.type === 'translation_delta') {
              translationText += message.text;
              translatedCaption.textContent = translationText;
            }
            if (message.type === 'error') {
              errorText.textContent = message.message;
              reject(new Error(message.message));
            }
          };
          socket.onerror = () => {
            errorText.textContent = 'The live connection failed. Check the server output.';
            reject(new Error(errorText.textContent));
          };
          socket.onclose = () => {
            if (!stopping) {
              reject(new Error(errorText.textContent || 'The live connection closed.'));
              if (ready) {
                if (!errorText.textContent) errorText.textContent = 'The live connection closed.';
                stopMicrophone();
              }
            }
          };
        });

        microphone = audioContext.createMediaStreamSource(stream);
        audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
        audioProcessor.onaudioprocess = event => {
          event.outputBuffer.getChannelData(0).fill(0);
          if (socket && socket.readyState === WebSocket.OPEN) {
            const samples = event.inputBuffer.getChannelData(0);
            sendAudio(convertToPcm16(samples, audioContext.sampleRate));
          }
        };
        microphone.connect(audioProcessor);
        audioProcessor.connect(audioContext.destination);

        statusText.textContent = 'Listening…';
        stopButton.disabled = false;
      } catch (error) {
        errorText.textContent = error.message;
        await stopMicrophone();
      }
    }

    startButton.addEventListener('click', startMicrophone);
    stopButton.addEventListener('click', stopMicrophone);
  </script>
</body>
</html>
